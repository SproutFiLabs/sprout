<!doctype html>
<html lang="en">
  <head>
    <meta name="referrer" content="no-referrer" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sprout - family stock-token savings</title>
    <!-- SVG first for browsers that take it; .ico is the fallback, and without
         it a request for /favicon.ico falls through to the SPA and returns
         index.html as text/html, which renders as a broken icon. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#fc7c1d" />
    <meta name="description" content="Plant a savings sprout for your kid that holds real stock tokens. Family can chip in with a gift link, and it becomes theirs on the date you pick. In beta on Robinhood Chain." />
    <!-- Link previews (X, iMessage, Slack, Discord). Crawlers do not run
         JavaScript, so these have to be in the served HTML, with absolute URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sprout" />
    <meta property="og:url" content="https://www.sproutfy.tech/" />
    <meta property="og:title" content="Sprout: grow a portfolio for your kid" />
    <meta property="og:description" content="A savings sprout that holds real stock tokens. Family chips in with a gift link, and on the date you pick, it becomes theirs." />
    <meta property="og:image" content="https://www.sproutfy.tech/og-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sprout: grow a portfolio for your kid." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sprout: grow a portfolio for your kid" />
    <meta name="twitter:description" content="A savings sprout that holds real stock tokens. Family chips in with a gift link, and on the date you pick, it becomes theirs." />
    <meta name="twitter:image" content="https://www.sproutfy.tech/og-card.jpg" />
    <meta name="twitter:image:alt" content="Sprout: grow a portfolio for your kid." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
